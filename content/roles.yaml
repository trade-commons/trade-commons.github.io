# Who runs what, and who it serves.
#
# The component catalogue is organised by what a thing is. This is the same material organised by
# the job somebody has, because an organisation arriving here knows its own role long before it
# knows which component it needs.
#
# `register` names the UN register this role is listed in, where there is one. Not every role is
# listed anywhere, and saying so is more useful than implying everyone ends up somewhere.
#
# `operates` names catalogue entries the role deploys or uses. `serves` names the roles that consume
# what it publishes or operates. `value` names the business cases that argue for this role adopting,
# on the Value page. All three are validated at build time, so a role cannot point at something that
# does not exist.

- id: producer
  order: 1
  name: Producer or supplier
  summary: >-
    Makes or supplies something and needs to say what it is, where it came from and what it complies
    with, in a form a buyer can check without asking.
  operates:
    - easy
    - storage
    - connectors
  serves:
    - buyer
    - customs-administration
    - regulator
  note: >-
    The smallest producers run none of this themselves and publish through a community programme or
    a vendor. The capability is the same and the hosting is somebody else's.
  value:
    - untp-industry
    - unvtd-trader

- id: conformity-assessment-body
  order: 2
  name: Conformity assessment body
  summary: >-
    Audits, inspects or certifies against a published scheme, and issues the result as a credential
    that names the criterion it tested.
  operates:
    - easy
    - storage
  serves:
    - producer
    - buyer
    - regulator
  value:
    - untp-services

- id: scheme-owner
  order: 3
  name: Conformity scheme owner
  summary: >-
    Owns the criteria that conformity assessment bodies test against, and publishes them as
    machine-readable artefacts so a credential can cite a criterion by identifier.
  operates:
    - cvc
  serves:
    - conformity-assessment-body
    - buyer
    - verifier-operator
  value:
    - untp-services
  register: cvc

- id: registrar
  order: 4
  name: Registration authority
  summary: >-
    A business register, land register, asset register or trademark office, whose authority comes
    from statute. Already the authoritative answer to whether an entity exists and who controls it,
    and issues identity anchors that carry that answer to a verifier who has never dealt with it.
  operates:
    - vckit
    - did-manager
    - idr
    - storage
    - blind-witness
    - verifier
  serves:
    - producer
    - buyer
    - customs-administration
    - verifier-operator
  value:
    - unvtd-registry
  register: grid
  note: >-
    These are deployed as separate services and not as one package. A register of any size already
    has its own systems and its own public face, and will put its own interface over them, so what
    the Commons supplies is the services underneath and not an application to adopt whole.

- id: identifier-scheme-operator
  order: 5
  name: Identifier scheme operator
  summary: >-
    Runs a register of products, facilities, locations, members or assets that is not a government
    register: a member association, an industry body, a product or facility registry. Enrols and
    maintains entries much as an authoritative register does, and its authority comes from its
    members or its sector instead of from statute.
  operates:
    - idr
    - storage
    - vckit
  serves:
    - producer
    - buyer
    - verifier-operator
  register: idr
  value:
    - untp-services
  note: >-
    There are thousands of these and only a handful of authoritative registers, so most identifiers
    in circulation come from here. The difference from a registration authority is what a verifier
    may conclude: a statutory register answers whether an entity exists in law, and a scheme answers
    whether it is a member in good standing of something. Both are useful and they are not
    interchangeable, which is why they are listed in different registers.

- id: customs-administration
  order: 6
  name: Customs administration
  summary: >-
    Receives trade documents and consignment claims at a border, and needs to verify them and turn
    them into declaration data for the systems it already runs.
  operates:
    - customs
  serves:
    - producer
    - regulator
  value:
    - unvtd-customs
    - unvtd-country
    - untp-government

- id: facility-operator
  order: 7
  name: Facility operator
  summary: >-
    Runs a mine, mill, farm or plant where assessed material is received, processed and sent on, and
    has to account for it without exposing volumes or customers to competitors.
  operates:
    - facility-coc
    - storage
  serves:
    - buyer
    - conformity-assessment-body
  value:
    - untp-industry

- id: buyer
  order: 8
  name: Buyer, brand owner or OEM
  summary: >-
    Buys from a supply base and has to establish whether the claims attached to what it bought
    survive scrutiny, across many suppliers and many schemes.
  operates:
    - verifier
  serves:
    - regulator
  value:
    - untp-industry
    - unvtd-bank

- id: community
  order: 9
  name: Community or sector programme
  summary: >-
    A sector or jurisdiction programme that defines how the protocol applies in its domain. Publishes
    an extension, overlay rules and a profile, and registers them so engines can find them.
  operates:
    - cap-template
  serves:
    - producer
    - conformity-assessment-body
    - buyer
  note: >-
    A community publishes declarations and does not build software. The extension, the overlay shape
    graph and the profile live on the community's own infrastructure, and every engine reads them.
    Convening the community in the first place is a different job, documented by UN/CEFACT and
    supported by the sectoral forums; the Commons supplies the format, the template and the
    validator, and does not run the programme.
  value:
    - untp-cap
  register: cap

- id: vendor
  order: 10
  name: Software vendor
  summary: >-
    Builds products that issue, verify or move credentials, for customers who will not build their
    own.
  operates:
    - vckit
    - graph-validation
    - connector-sdk
    - connector-template
    - tests-untp
  serves:
    - producer
    - conformity-assessment-body
    - buyer
    - registrar
  value:
    - untp-services
  register: swi

- id: verifier-operator
  order: 11
  name: Verification service operator
  summary: >-
    Runs verification for others, whether as a commercial service, a market platform check or a
    public good.
  operates:
    - verifier
    - graph-validation
  serves:
    - buyer
    - customs-administration
    - regulator
  value:
    - untp-services

- id: regulator
  order: 12
  name: Regulator
  summary: >-
    Sets or enforces a disclosure obligation, and needs to establish whether a claim made to satisfy
    it can be checked rather than merely asserted.
  operates:
    - verifier
  serves: []
  value:
    - untp-government
    - untp-impact

- id: commons
  order: 13
  name: The Commons itself
  summary: >-
    Operates the shared infrastructure that nobody else can run neutrally, and publishes the tooling
    everyone else deploys.
  operates:
    - conformance
    - infra
    - site
  serves:
    - vendor
    - producer
    - community
    - registrar
