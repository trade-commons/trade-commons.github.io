# The component catalogue.
#
# One entry per component, wherever it lives. Adding one is a pull request against this file, and the
# entry is where somebody states who is accountable for the component.
#
# `home` records where the code is today, not where it is expected to end up. Where a move or a
# donation has been agreed in principle but not carried out, that belongs in `disposition`, without
# a date unless a date has actually been agreed.
#
# `maturity: proposed` means the component appears in the repository architecture and does not exist
# yet: no repository, no code, and nobody committed to building it. A proposed entry carries no `home`
# and no `maintainer`, because it has nowhere to point and nobody accountable, and the schema enforces
# that distinction so a proposal cannot quietly read as a product. `planned` is the next step up: a
# repository exists and work has not started.
#
# The proposed set is published so the shape of the whole is visible and can be argued with. It is
# drawn from a draft architecture under discussion and is not a commitment, a roadmap or a schedule.

- id: vckit
  name: VCkit
  summary: >-
    Credential issuance and verification at the level of a single credential: signing, issuer
    resolution, revocation and schema validity. The bottom layer of the verification stack, imported
    by the things above it.
  tier: library
  maturity: production
  home:
    org: uncefact
    url: https://github.com/uncefact/project-vckit
  standards:
    - W3C Verifiable Credentials
    - W3C Decentralised Identifiers
    - UNTP
  licence: Apache-2.0
  maintainer: UN/CEFACT UNTP project team
  operated: false
  disposition: >-
    Expected to move into trade-commons. Nobody created the uncefact GitHub organisation as a
    UN/CEFACT asset; it grew up informally, and the authoritative specification content has since
    moved to UNICC GitLab. What is left there is adoption tooling that was always in the wrong place.
    Not yet scheduled.

- id: storage
  name: Storage Service
  summary: >-
    Credential storage, serving a credential at a stable, resolvable address so a verifier can fetch
    what a link points at.
  tier: service
  maturity: production
  home:
    org: uncefact
    url: https://github.com/uncefact/project-storage-service
  standards:
    - UNTP
    - W3C Verifiable Credentials
  interfaces:
    - api
  licence: Apache-2.0
  maintainer: UN/CEFACT UNTP project team
  operated: false
  disposition: Expected to move into trade-commons, with VCkit. Not yet scheduled.

- id: idr
  name: Identity Resolver
  summary: >-
    Resolves an identifier to the credentials and documents published against it, so a link on a
    product resolves to whatever has been said about that product.
  tier: service
  maturity: production
  home:
    org: pyx-industries
    url: https://github.com/pyx-industries/pyx-identity-resolver
  standards:
    - UNTP
    - ISO 18975
  interfaces:
    - api
  licence: Apache-2.0
  maintainer: Pyx Industries
  operated: false
  disposition: >-
    Offered as a contribution from Pyx Industries. A donation of a component a vendor also sells is
    what makes the commons credible to that vendor's competitors, so it needs a date, a licence and a
    minute. Done quietly it convinces nobody. Not yet completed.

- id: tests-untp
  name: UNTP Test Suites and Playground
  summary: >-
    Conformance and interoperability test suites, the reference implementation they exercise, and the
    playground that lets an implementer check a credential without installing anything.
  tier: tooling
  maturity: production
  home:
    org: uncefact
    url: https://github.com/uncefact/tests-untp
  standards:
    - UNTP
  licence: Apache-2.0
  maintainer: UN/CEFACT UNTP project team
  operated: false
  disposition: >-
    Expected to move into trade-commons. A hosted conformity testing service, which charter
    section 2 allows the Commons to operate on a cost-recovery basis, depends on it. Not yet
    scheduled.

# --- Organisation ------------------------------------------------------------------------------

- id: site
  name: Organisation site and catalogue
  summary: >-
    This site, and the component catalogue it builds its component page from. The catalogue is the
    substance and the website is how you read it.
  tier: organisation
  maturity: beta
  home:
    org: trade-commons
    url: https://github.com/trade-commons/trade-commons.github.io
  standards: []
  interfaces:
    - ui
  licence: GPL-3.0
  maintainer: Global Trade Commons
  operated: true

- id: org-defaults
  name: Organisation defaults
  summary: >-
    The organisation profile, contribution guide, code of conduct, security policy and the default
    issue and pull request templates that every repository inherits.
  tier: organisation
  maturity: beta
  home:
    org: trade-commons
    url: https://github.com/trade-commons/.github
  standards: []
  licence: Apache-2.0
  maintainer: Global Trade Commons
  operated: false

- id: governance
  name: Governance record
  summary: >-
    Licence, contribution policy, decision-making record and the donation record.
  tier: organisation
  maturity: proposed
  standards: []
  disposition: >-
    The site's governance page carries this content for now. A separate repository becomes worth
    having once there are decisions to minute and a donation record to keep.

# --- Libraries ---------------------------------------------------------------------------------

- id: graph-validation
  name: Graph validation
  summary: >-
    Verification across many credentials, where vckit handles one. Assembles the graph from a
    credential and the links it carries, then evaluates SHACL against a resolved profile and its
    overlays. The mechanism that lets a community add rules without anyone changing software.
  tier: library
  maturity: proposed
  standards:
    - UNTP
    - W3C Verifiable Credentials
    - SHACL
  disposition: >-
    The verification side of the engine-and-declaration split, and the closest to existing. UNTP
    already publishes SHACL shapes, and the recommended profile unions several of them.

- id: connector-sdk
  name: Connector SDK
  summary: >-
    Shared scaffolding for source-system connectors: authentication, mapping, scheduling and error
    handling, so a connector author writes the mapping and not the plumbing.
  tier: library
  maturity: proposed
  standards:
    - UNTP
    - UNVTD
  disposition: >-
    Exists to stop each connector reimplementing the same plumbing. It is only worth building once
    several connectors exist, so it should follow the first two or three.

# --- Services ----------------------------------------------------------------------------------

- id: blind-witness
  name: Blind witness
  summary: >-
    Witnessing for transferable records, and for chain of custody where the parties will not reveal
    their counterparties to each other.
  tier: service
  maturity: proposed
  standards:
    - UNTP
    - UNVTD
  interfaces:
    - api
  disposition: >-
    New work. Nothing comparable exists to move in or adopt.

- id: cvc
  name: Conformity vocabulary catalogue
  summary: >-
    Lets a conformity scheme owner manage its criteria and vocabulary as published, machine-readable
    artefacts, so a conformity credential can cite a criterion by identifier instead of quoting it.
  tier: service
  maturity: proposed
  standards:
    - UNTP
    - UNVTD
  interfaces:
    - api
    - ui
  disposition: >-
    Would build on conformity-schemes-as-code work already done for an industry scheme owner, which
    is not yet public. Scheme criteria belong to the scheme owner, so this manages a catalogue the
    Commons does not own.

- id: conformance
  name: Conformity testing service
  summary: >-
    Deployment, configuration and operational contract for a hosted conformity testing service. It
    calls the upstream test suites and does not reimplement them.
  tier: service
  maturity: proposed
  standards:
    - UNTP
  interfaces:
    - api
    - ui
  disposition: >-
    Charter section 2 places cost-recovery conformity testing in scope, and establishing whether a
    credential is genuine is the most load-bearing thing the Commons could operate. It depends on the
    test suites moving first, which also makes it the test of whether adoption from the existing
    organisation works at all.

- id: did-manager
  name: Decentralised identifier management
  summary: >-
    Maintains decentralised identifier documents on behalf of the parties a registry serves: hosting
    them at a resolvable address, rotating keys, and keeping the witnessed log that lets a verifier
    confirm the document was not changed behind its back.
  tier: service
  maturity: proposed
  interfaces:
    - api
  standards:
    - W3C Decentralised Identifiers
    - did:webvh
    - UNTP
  disposition: >-
    A gap the catalogue did not previously record. Resolving an identifier to the credentials
    published against it is the identity resolver's job and this is a different one, because a
    registrant that cannot run its own key infrastructure still needs a document that resolves and a
    history a verifier can check. Required by the registry node.

# --- Applications ------------------------------------------------------------------------------

- id: easy
  name: Easy issuer
  summary: >-
    The spec-driven issuing application. Mobile-responsive, reads published schemas, render
    templates and community profiles, and issues any UNTP or UNVTD credential. No rebuild per
    sector.
  tier: application
  maturity: proposed
  standards:
    - UNTP
    - UNVTD
  composedOf:
    - vckit
  interfaces:
    - api
    - ui
  disposition: >-
    One application, not one per credential type. Identity setup, key handling, form rendering,
    validation, signing, publishing and revocation are most of the code and all of it is shared.
    What varies between users is the sector they work in. It must produce a correct if unpolished
    result with no community declaration present, or nobody can use it until the first community
    acts.

- id: verifier
  name: Verifier
  summary: >-
    Checking a credential, as a job somebody does. Assembles the graph through graph-validation,
    checks each credential through vckit, resolves the applicable overlays, and reports against both
    core and community rules. The layer a buyer or a regulator actually uses.
  tier: application
  maturity: proposed
  standards:
    - UNTP
    - W3C Verifiable Credentials
  composedOf:
    - graph-validation
    - vckit
  interfaces:
    - api
    - ui
  disposition: >-
    An application over the graph validation library, and a test of the rule that an application
    contains no protocol code. The day it reimplements what the library does, the rule has failed.

- id: connectors
  name: Source-system connectors
  summary: >-
    Community-maintained connectors to source systems, one package per system, with independent
    package versions. A connector runs, pulls from the source system and emits credentials. Nobody
    opens it.
  tier: service
  maturity: proposed
  standards:
    - UNTP
    - UNVTD
  interfaces:
    - api
  disposition: >-
    One repository, not one per vendor or per specification. A finance-system connector emits trade
    documents and may also emit passports for the goods on them, so splitting by specification would
    put one integration in two repositories and duplicate its authentication and mapping. When a
    vendor takes over maintenance, the package is archived here and the catalogue repoints at the
    vendor. That is the outcome the Commons wants, and the catalogue records which state each
    connector is in so that a reader can tell a community demonstration from a supported product.

- id: facility-coc
  name: Facility chain of custody
  summary: >-
    Facility-level volumetric accounting. A holder records what it takes in and allocates out against
    each assessed attribute, and proves nothing is acquitted beyond what was assessed, without
    revealing quantities or counterparties.
  tier: application
  maturity: proposed
  standards:
    - UNTP
    - W3C Verifiable Credentials
    - W3C Decentralised Identifiers
    - Certificate Transparency
  composedOf:
    - blind-witness
    - vckit
  interfaces:
    - api
    - ui
  disposition: >-
    No shared ledger, no operator and no party with a view across the chain. Each holder keeps a
    Merkle transparency log, which keeps proofs short as a register reaches millions of entries. A
    Merkle tree proves membership and adds nothing up, so showing a buyer that a supplier stayed
    within an assessed cap takes a sum-committing tree whose root is published, and each holder
    checks its own leaf against that root. Enforcement rests on the fraction of holders who check
    and not on the cryptography. Depends on the UNTP 1.0 custody-model and coverage changes and the
    1.1 assessed-quantity bound, so it cannot be built ahead of the specification.

# --- Operations and templates ------------------------------------------------------------------

- id: infra
  name: Commons operating infrastructure
  summary: >-
    Deployment and configuration for the few things the Commons itself runs, principally the hosted
    conformity testing service and this site.
  tier: organisation
  maturity: proposed
  standards: []
  disposition: >-
    Deliberately narrow. Deployment configuration for a component ships inside that component's own
    repository, because charter section 9 requires every service to be deployable by a third party
    from its own repository, and a central infrastructure repository would make the Commons the only
    party able to deploy anything. What is left for a repository of its own is the Commons acting as
    an operator of its own services, which is a different job from publishing software for others to
    run.

- id: cap-template
  name: Community profile template
  summary: >-
    The structure a community should adopt: profile, extension schema and context, overlay shapes,
    and a workflow that serves the profile at the expected well-known location.
  tier: template
  maturity: proposed
  standards:
    - UNTP
  disposition: >-
    Higher priority than its tier suggests. The register already carries several programmes, each
    declaring the extension it owns and the identifier schemes it uses, but the profile document each
    entry points at is in most cases not yet served. Every engine downstream reads what this
    produces, and an engine built before any declaration exists has nothing to read. It should ship a
    worked example that validates, so a programme starts from something that works.

- id: connector-template
  name: Connector template
  summary: >-
    Starting point for a vendor building and maintaining its own connector.
  tier: template
  maturity: proposed
  standards:
    - UNTP
    - UNVTD
  disposition: >-
    How a vendor takes over a connector that started in the shared repository.
